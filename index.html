<!DOCTYPE html>
<html lang="en" class="bg-[#05070a] scroll-smooth h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vayu IDE - Neural Workspace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://js.puter.com/v2/"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Fira+Code:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { --accent: #4285f4; --bg: #05070a; }
    body { 
      font-family: 'Inter', sans-serif; 
      margin: 0; 
      padding: 0; 
      overflow: hidden; 
      color: #e2e8f0; 
      background: var(--bg); 
      -webkit-font-smoothing: antialiased; 
      height: 100%;
    }
    #root { height: 100%; }
    .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }
    
    .monaco-editor { padding-top: 10px; }
    
    ::selection { background: rgba(66, 133, 244, 0.3); color: #fff; }

    /* Markdown Styles */
    .markdown-body { color: #e2e8f0; line-height: 1.6; }
    .markdown-body code { font-family: 'JetBrains Mono', monospace; }
    .markdown-body pre { background: transparent !important; padding: 0 !important; margin: 0 !important; }
    .markdown-body p { margin-bottom: 1rem; }
    .markdown-body ul, .markdown-body ol { margin-bottom: 1rem; padding-left: 1.5rem; }
    .markdown-body li { margin-bottom: 0.25rem; }
  </style>
</head>
<body class="h-full overflow-hidden">
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
</body>
</html>
